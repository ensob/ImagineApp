<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Dream Generator ✨</h1>
            <p>Discover imaginative worlds and ideas</p>
        <header>
            <h1>Imagina lo que no puedes crear...hasta ahora...!</h1>
            <p>Discover imaginative worlds and ideas</p>
        </header>
                <div id="dreamOutput" class="dream-output"></div>
            </div>
            
            <div class="ideas-section">
                <h2>Random Ideas</h2>
                <div id="ideasContainer" class="ideas-container"></div>
            </div>
        </main>
        
        <footer>
            <p>Imagination is the beginning of creation.</p>
        </footer>

        <script>
            // Sample data for imaginative concepts
            const concepts = [
                    "A floating city in the clouds where gravity can be turned on and off",
                    "An ocean that flows upward into the sky, creating upside-down waterfalls",
                    "A library where books write themselves based on your thoughts",
                    "A forest where trees whisper secrets of the past to those who listen carefully",
                    "A planet where time moves backwards during the night",
                    "An underground city powered by bioluminescent fungi",
                    "A school where students learn by living inside their lessons",
                    "A mountain that changes its shape every century",
                    "A museum where exhibits come alive for one hour each day",
                    "A river that flows in spirals, never reaching its destination"
                ];

                // Simple generate button handler
                document.getElementById('generateBtn').addEventListener('click', () => {
                    const pick = concepts[Math.floor(Math.random() * concepts.length)];
                    document.getElementById('dreamOutput').textContent = pick;
                });
            </script>
        </div>
    </body>
    </html>
