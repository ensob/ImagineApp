<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imaginative Digital Art Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            background: linear-gradient(to right, #ff7eb3, #ff70a6, #ff85a2, #ff9999);
            background-clip: text; /* standard property for better compatibility */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 2px;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #e60073, 0 0 20px #e60073;
            }
            to {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6;
            }
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 3rem;
            opacity: 0.8;
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        button {
            background: linear-gradient(45deg, #ff7eb3, #ff70a6);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 110, 179, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 110, 179, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        .canvas-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        canvas {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            width: 100%;
            height: 400px;
            display: block;
        }

        .art-info {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            margin-top: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .art-info h2 {
            margin-bottom: 1rem;
            color: #ff7eb3;
        }

        .art-description {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .controls {
                padding: 1rem;
            }
            
            .control-group {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <h1>Imaginative Digital Art Generator</h1>
        <p class="subtitle">Create unique digital art with interactive elements</p>
        
        <div class="controls">
            <div class="control-group">
                <button id="generateBtn">Generate New Art</button>
                <button id="randomBtn">Random Style</button>
                <button id="saveBtn">Save Artwork</button>
            </div>
            <div class="control-group">
                <button id="waveBtn">Wave Pattern</button>
                <button id="spiralBtn">Spiral Pattern</button>
                <button id="fractalBtn">Fractal Pattern</button>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="artCanvas"></canvas>
        </div>
        
        <div class="art-info">
            <h2>Current Artwork</h2>
            <p class="art-description" id="artDescription">A mesmerizing blend of geometric patterns and fluid dynamics, creating an ever-evolving visual experience.</p>
        </div>
    </div>

    <script>
        // Create background particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 10 + 2;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const animationDuration = Math.random() * 20 + 10;
                const animationDelay = Math.random() * 5;
                const hue = Math.random() * 360;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.animationDuration = `${animationDuration}s`;
                particle.style.animationDelay = `${animationDelay}s`;
                particle.style.background = `hsla(${hue}, 100%, 70%, 0.7)`;
                
                particlesContainer.appendChild(particle);
            }
        }

        // Art generator class
        class ArtGenerator {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                // Set initial canvas size
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
                
                this.currentStyle = 'wave';
                this.animationId = null;
            }
            
            resizeCanvas() {
                const container = this.canvas.parentElement;
                this.canvas.width = container.clientWidth - 40;
                this.canvas.height = 400;
            }
            
            drawWavePattern(time) {
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                // Clear canvas with a semi-transparent overlay for trail effect
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, width, height);
                
                // Draw waves
                this.ctx.beginPath();
                this.ctx.lineWidth = 3;
                this.ctx.strokeStyle = `hsl(${(time * 20) % 360}, 100%, 60%)`;
                
                for (let y = 0; y < height; y += 5) {
                    const x = Math.sin(y * 0.02 + time * 0.01) * 50 + 
                             Math.cos(y * 0.01 + time * 0.02) * 30 + 
                             width / 2;
                    
                    if (y === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
                
                // Draw additional wave patterns
                for (let i = 0; i < 5; i++) {
                    const offset = i * 20;
                    this.ctx.beginPath();
                    this.ctx.lineWidth = 1 + Math.sin(time * 0.01 + i) * 0.5;
                    this.ctx.strokeStyle = `hsla(${(time * 10 + i * 60) % 360}, 100%, 70%, 0.7)`;
                    
                    for (let y = 0; y < height; y += 5) {
                        const x = Math.sin(y * 0.02 + time * 0.01 + i) * 30 + 
                                 Math.cos(y * 0.01 + time * 0.02 + i) * 20 + 
                                 width / 2 + offset;
                        
                        if (y === 0) {
                            this.ctx.moveTo(x, y);
                        } else {
                            this.ctx.lineTo(x, y);
                        }
                    }
                    
                    this.ctx.stroke();
                }
            }
            
            drawSpiralPattern(time) {
                const width = this.canvas.width;
                const height = this.canvas.height;
                const centerX = width / 2;
                const centerY = height / 2;
                
                // Clear canvas with a semi-transparent overlay for trail effect
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, width, height);
                
                // Draw spiral
                this.ctx.beginPath();
                this.ctx.lineWidth = 2;
                this.ctx.strokeStyle = `hsl(${(time * 30) % 360}, 100%, 60%)`;
                
                const maxRadius = Math.min(width, height) * 0.4;
                const turns = 5;
                
                for (let i = 0; i < 200; i++) {
                    const angle = (i / 200) * turns * Math.PI * 2;
                    const radius = (i / 200) * maxRadius;
                    
                    const x = centerX + Math.cos(angle + time * 0.01) * radius;
                    const y = centerY + Math.sin(angle + time * 0.01) * radius;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
            }
            
            drawFractalPattern(time) {
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                // Clear canvas with a semi-transparent overlay for trail effect
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                this.ctx.fillRect(0, 0, width, height);
                
                // Draw fractal pattern
                this.drawFractal(0, 0, width, height, time * 0.01, 5);
            }
            
            drawFractal(x, y, w, h, time, depth) {
                if (depth <= 0) return;
                
                const ctx = this.ctx;
                const centerX = x + w / 2;
                const centerY = y + h / 2;
                
                // Draw circles
                ctx.beginPath();
                ctx.arc(centerX, centerY, Math.min(w, h) * 0.1, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${(time * 50 + depth * 30) % 360}, 100%, 60%, 0.7)`;
                ctx.fill();
                
                // Draw connecting lines
                if (depth > 1) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(x + w / 2, y);
                    ctx.strokeStyle = `hsla(${(time * 30 + depth * 40) % 360}, 100%, 70%, 0.5)`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                
                // Recursive calls for smaller fractals
                const newW = w / 2;
                const newH = h / 2;
                
                this.drawFractal(x, y, newW, newH, time, depth - 1);
                this.drawFractal(x + newW, y, newW, newH, time, depth - 1);
                this.drawFractal(x, y + newH, newW, newH, time, depth - 1);
                this.drawFractal(x + newW, y + newH, newW, newH, time, depth - 1);
            }
            
            draw(time) {
                switch (this.currentStyle) {
                    case 'wave':
                        this.drawWavePattern(time);
                        break;
                    case 'spiral':
                        this.drawSpiralPattern(time);
                        break;
                    case 'fractal':
                        this.drawFractalPattern(time);
                        break;
                }
                
                // Continue animation
                this.animationId = requestAnimationFrame((time) => this.draw(time));
            }
            
            start() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                this.draw(0);
            }
            
            changeStyle(style) {
                this.currentStyle = style;
                this.start();
            }
        }

        // Initialize the art generator
        const artGenerator = new ArtGenerator('artCanvas');
        
        // Set up event listeners
        document.getElementById('generateBtn').addEventListener('click', () => {
            artGenerator.start();
        });
        
        document.getElementById('randomBtn').addEventListener('click', () => {
            const styles = ['wave', 'spiral', 'fractal'];
            const randomStyle = styles[Math.floor(Math.random() * styles.length)];
            artGenerator.changeStyle(randomStyle);
            
            // Update description
            const descriptions = [
                "A mesmerizing blend of geometric patterns and fluid dynamics, creating an ever-evolving visual experience.",
                "An abstract representation of cosmic forces interacting in perfect harmony.",
                "A digital symphony of colors and shapes that dance together in eternal motion.",
                "A fusion of traditional art forms with modern computational creativity."
            ];
            
                const randomDesc = descriptions[Math.floor(Math.random() * descriptions.length)];
                document.getElementById('artDescription').textContent = randomDesc;
            });

            // Initialize particles and start the generator
            createParticles();
            artGenerator.start();
        </script>
    </body>
    </html>
